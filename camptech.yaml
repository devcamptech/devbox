# Isolated Linux VM for Camptech development (Lima). Nothing from the host is shared:
# no folder mounts, no SSH agent, no host SSH keys. Logins (Claude, gh, Vercel, Supabase)
# and the code live only on the VM's disk.
#
#   limactl start --name=camptech https://raw.githubusercontent.com/devcamptech/devbox/main/camptech.yaml
#   limactl shell camptech
#
# Provisioning runs on every boot, so each step must be safe to repeat.
minimumLimaVersion: 2.0.0

# No vmType: Lima uses vz on macOS and QEMU on Linux.
cpus: 4
memory: 8GiB
disk: 60GiB

# No host folders inside the VM (the default template mounts ~ read-only).
mounts: []

ssh:
  # Never expose the host's SSH agent (work keys) or ~/.ssh public keys to the VM.
  forwardAgent: false
  loadDotSSHPubKeys: false
  forwardX11: false

# Docker comes from Docker's apt repository below; no Lima-managed containerd.
containerd:
  system: false
  user: false

# Only what the host's browser needs, on 127.0.0.1: the app and local Supabase
# (API, database, Studio, Mailpit). Every other guest port stays inside the VM.
portForwards:
- guestPort: 3000
- guestPortRange: [54321, 54324]
- guestIP: "0.0.0.0"
  guestIPMustBeZero: false
  proto: any
  ignore: true

provision:
- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    arch="$(dpkg --print-architecture)"
    codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"

    apt-get update
    apt-get install -y ca-certificates curl gnupg git jq unzip xz-utils build-essential postgresql-client

    # Docker Engine and GitHub CLI from their official apt repositories (signed).
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
    chmod a+r /etc/apt/keyrings/docker.asc /etc/apt/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$arch signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
      > /etc/apt/sources.list.d/docker.list
    echo "deb [arch=$arch signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      > /etc/apt/sources.list.d/github-cli.list
    apt-get update
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin gh

    # Node.js LTS from nodejs.org, checked against the published SHA-256 list.
    node_major=24
    if ! command -v node >/dev/null || [ "$(node -p 'process.versions.node.split(".")[0]')" != "$node_major" ]; then
      node_arch="$([ "$arch" = amd64 ] && echo x64 || echo "$arch")"
      base="https://nodejs.org/dist/latest-v${node_major}.x"
      work="$(mktemp -d)"
      curl -fsSL "$base/SHASUMS256.txt" -o "$work/SHASUMS256.txt"
      file="$(grep -oE "node-v[0-9.]+-linux-${node_arch}\.tar\.xz" "$work/SHASUMS256.txt" | head -n1)"
      curl -fsSL "$base/$file" -o "$work/$file"
      (cd "$work" && grep " ${file}\$" SHASUMS256.txt | sha256sum -c -)
      tar -xJf "$work/$file" -C /usr/local --strip-components=1 --exclude='*.md' --exclude=LICENSE
      rm -rf "$work"
    fi

- mode: user
  script: |
    #!/bin/bash
    set -euo pipefail
    # Docker without sudo (the VM is the isolation boundary).
    sudo usermod -aG docker "$USER"

    # Global npm packages in the user's home, so Claude Code can update itself.
    npm config set prefix "$HOME/.npm-global"
    if ! grep -q 'npm-global/bin' "$HOME/.bashrc"; then
      echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> "$HOME/.bashrc"
    fi
    export PATH="$HOME/.npm-global/bin:$PATH"
    # Installed once; afterwards Claude Code updates itself and `npm i -g vercel@<version>` upgrades Vercel.
    command -v claude >/dev/null || npm install -g @anthropic-ai/claude-code@2.1.312
    command -v vercel >/dev/null || npm install -g vercel@65.5.0

    git config --global init.defaultBranch main
    mkdir -p "$HOME/code"

    # The app's setup script, ready to run after the first login (see README).
    curl -fsSL https://raw.githubusercontent.com/devcamptech/devbox/main/bootstrap.sh -o "$HOME/bootstrap.sh"
    chmod +x "$HOME/bootstrap.sh"

    # Claude Code's instructions for the devbox (check logins first), refreshed on every boot and imported from
    # the user's CLAUDE.md, which is created if missing and otherwise only gets the import line.
    mkdir -p "$HOME/.claude"
    curl -fsSL https://raw.githubusercontent.com/devcamptech/devbox/main/claude/devbox.md -o "$HOME/.claude/devbox.md"
    touch "$HOME/.claude/CLAUDE.md"
    grep -qxF '@~/.claude/devbox.md' "$HOME/.claude/CLAUDE.md" || printf '@~/.claude/devbox.md\n' >> "$HOME/.claude/CLAUDE.md"

probes:
- mode: readiness
  description: tools installed
  script: |
    #!/bin/bash
    set -eu
    export PATH="$HOME/.npm-global/bin:$PATH"
    for tool in node docker gh claude vercel; do
      command -v "$tool" >/dev/null || exit 1
    done
  hint: See /var/log/cloud-init-output.log in the VM.

# Ubuntu 24.04 cloud image: the dated release first (checked by digest), then the latest release.
# Dated images are removed after some months; then the fallback is used. `limactl prune` clears the cache.
images:
- location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"
- location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img"
  arch: "x86_64"
  digest: "sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2"
- location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"
- location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
  arch: "x86_64"
